<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<meta name="theme-color" content="#2f8a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Defensores del Monte</title>
<style>
  html,body{margin:0;height:100%;background:#0b140b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{display:flex;align-items:center;justify-content:center}
  #c{background:#000;display:block;touch-action:none}
  #touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:5}
  #touch .b{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.6);color:#fff;font:bold 22px sans-serif;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
  #touch .b.on{background:rgba(255,225,74,.65)}
  #dpL{left:14px;bottom:70px;width:74px;height:74px}
  #dpR{left:186px;bottom:70px;width:74px;height:74px}
  #dpU{left:100px;bottom:134px;width:74px;height:74px}
  #dpD{left:100px;bottom:14px;width:74px;height:60px}
  #bA{right:20px;bottom:90px;width:92px;height:92px;background:rgba(224,58,58,.4);font-size:18px}
  #bJ{right:128px;bottom:60px;width:82px;height:82px;background:rgba(74,168,255,.4)}
  #bB{right:124px;bottom:150px;width:74px;height:74px;background:rgba(255,154,58,.42);font-size:17px}
  #bS{right:30px;bottom:200px;width:66px;height:66px;background:rgba(255,225,74,.35)}
  #rotate{display:none;position:fixed;inset:0;background:#102010;color:#fff;font:bold 22px sans-serif;align-items:center;justify-content:center;text-align:center;z-index:9;padding:30px}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="touch">
  <div class="b" id="dpL">◀</div><div class="b" id="dpR">▶</div><div class="b" id="dpU">▲</div><div class="b" id="dpD">▼</div>
  <div class="b" id="bA">ATQ 1</div><div class="b" id="bB">ATQ 2</div><div class="b" id="bJ">SALTO</div><div class="b" id="bS">★</div>
</div>
<div id="rotate">📱 Gira el móvil en horizontal para jugar</div>
<script src="js/meta.js"></script>
<script src="js/decor.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
